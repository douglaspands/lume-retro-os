# policy.toml gerado por `ctx init` (agent-harness-hub v0.3.0): fonte única de governança do harness.
# Fonte única declarativa: sincroniza Antigravity (.agents/hooks.json, GEMINI.md) e Claude Code (.claude/settings.json, CLAUDE.md)
# Após editar: execute `.venv/bin/ctx rule sync` (ou `uv run ctx rule sync`).
# Os comandos de diagnóstico de pacotes abaixo são de Fedora/RHEL; em Debian/Ubuntu troque por
# "dpkg -l", "apt list", "apt show", "apt search".

[project]
name = "r36s_all"
version = "0.1.0"

[ctx]
# Como os agentes invocam o motor ctx neste projeto (usado nas instruções geradas em AGENTS.md/CLAUDE.md/GEMINI.md).
# Padrão: ".venv/bin/ctx" (kit instalado no .venv do projeto; funciona em sandbox). Alternativa: "ctx" (uv tool install).
runner = ".venv/bin/ctx"

[commands]
# Comandos aprovados automaticamente (allow) para autonomia ágil dentro do repositório.
# Comandos fora desta lista recebem `defer` (Claude Code: modo de permissão nativo / AGY: force_ask).
allow = [
    "git status",
    "git diff",
    "git log",
    "git branch",
    "git show",
    "git ls-files",
    "uv run",
    "uv sync",
    "uv venv",
    "python3 -m venv .venv",
    "scripts/venv-python",
    ".venv/bin/ctx",
    ".venv/bin/python",
    "ctx",
    "bin/ctx",
    "pytest",
    "rg",
    "fd",
    "tree -L",
    "jq",
    "ls",
    "cat",
    "head",
    "tail",
    "wc",
    "pwd",
    "lsattr",
    "systemctl is-active",
    "systemctl is-enabled",
    "systemctl is-failed",
    "systemctl list-units",
    "journalctl -u",
    "journalctl -b",
    "journalctl -p",
    "hostnamectl",
    "ip addr",
    "ip -br addr",
    "rpm -q",
    "dnf list",
    "dnf info",
    "dnf search",
]

# "Ask forte": operações sensíveis que sempre exigem confirmação explícita do usuário
ask = [
    "git push",
    "git commit",
    "git checkout",
    "git reset",
    "git rebase",
    "git clean",
    "rm",
    "chattr",
    "dnf install",
    "dnf remove",
    "dnf upgrade",
    "apt install",
    "apt-get install",
    "apt remove",
    "brew install",
    "pip install",
    "uv pip install",
    "npm install -g",
    "systemctl start",
    "systemctl stop",
    "systemctl restart",
    "systemctl enable",
    "systemctl disable",
]

# Wrappers que ocultam o comando real (sempre ask forte)
wrappers = ["env", "xargs", "sh", "bash", "zsh", "nohup", "timeout", "nice", "exec", "eval", "command", "busybox"]

# Comandos proibidos e bloqueados imediatamente
deny = [
    "rm -rf /",
    "mkfs",
    ":(){ :|:& };:",
    "curl | bash",
    "wget | bash",
    "curl | sh",
    "wget | sh",
]

# Filtros seguros aprovados automaticamente em pipes simples (ex: cmd | rg termo)
safe_pipe_filters = [
    "head",
    "tail",
    "rg",
    "grep",
    "wc",
    "sort",
    "uniq",
    "jq",
    "cut",
    "tr",
]

# Receitas One-Shot: comandos parametrizados que acertam na 1ª tentativa (injetadas no Turno 0)
[commands.one_shot_recipes]
ctx_status = ".venv/bin/ctx status"
ctx_map = ".venv/bin/ctx map [subcaminhos...]"
ctx_search = ".venv/bin/ctx search \"<q1>\" [\"<q2>\" ...] --lines 25"
rg_context = "rg -n --heading -C 2 \"<padrao>\" [caminho]"
fd_scoped = "fd --max-depth 3 --exclude archive \"<padrao>\" [caminho]"
tree_compact = "tree -L 2 --dirsfirst -I \".venv|__pycache__|.git|.ctx|archive\""
git_status_short = "git status -s -b"
git_log_compact = "git log --oneline --decorate -n 10"

# Coaching de Eficiência: variantes ineficientes recebem `deny` instrutivo com a Receita One-Shot
[commands.inefficient_variants]
"grep -r" = "Use a Receita One-Shot: rg -n --heading -C 2 \"<padrao>\" [caminho] (ou .venv/bin/ctx search \"<termo>\" --lines 25)"
"grep -R" = "Use a Receita One-Shot: rg -n --heading -C 2 \"<padrao>\" [caminho] (ou .venv/bin/ctx search \"<termo>\" --lines 25)"
"grep --recursive" = "Use a Receita One-Shot: rg -n --heading -C 2 \"<padrao>\" [caminho] (ou .venv/bin/ctx search \"<termo>\" --lines 25)"
"find ." = "Use a Receita One-Shot: fd --max-depth 3 --exclude archive \"<padrao>\" [caminho] (ou .venv/bin/ctx map [subcaminhos...])"
"ls -R" = "Use a Receita One-Shot: tree -L 2 --dirsfirst -I \".venv|__pycache__|.git|.ctx|archive\" (ou .venv/bin/ctx map)"
tree_unbounded = "Sempre passe -L <nivel> no tree. Receita One-Shot: tree -L 2 --dirsfirst -I \".venv|__pycache__|.git|.ctx|archive\""
git_log_unbounded = "Sempre limite o git log com -n <N>. Receita One-Shot: git log --oneline --decorate -n 10"

[harnesses]
# Harnesses que recebem hook do guardrail no `ctx rule sync` (arquivo de configuração do projeto de cada um):
#   claude -> .claude/settings.json   codex -> .codex/hooks.json (confie em /hooks)   cursor -> .cursor/hooks.json
#   gemini -> .gemini/settings.json   antigravity -> .agents/hooks.json (formato ainda não validado na doc oficial)
# Instruções: AGENTS.md (Codex, Cursor, Copilot e outros), CLAUDE.md, GEMINI.md (Gemini CLI e Antigravity).
# Remova da lista os harnesses que o projeto não usa.
enabled = ["claude", "antigravity"]

[harnesses.codex]
# O hook do Codex não suporta "ask". "deny" (seguro): o agente recebe o motivo e pede ao usuário. "allow": deixa passar.
ask_fallback = "deny"

[harnesses.gemini]
# O hook do Gemini CLI não documenta "ask". Mesmas opções do Codex.
ask_fallback = "deny"

[file_tools]
# Leitura/escrita de arquivos via shell (cat/head/tail/sed -n, sed -i, >, >>, heredoc, tee) -> ferramenta nativa do harness.
# "off": só instruções (AGENTS.md/CLAUDE.md/GEMINI.md). "coach": o guardrail nega com a ferramenta certa na mensagem.
# Meça antes e depois com `ctx metrics` (ver guia, seção "Ferramentas Nativas de Arquivo").
mode = "off"
# Codex só recebe orientação de escrita (apply_patch): ele não tem ferramenta de leitura e lê via shell por design.
harnesses = ["claude", "antigravity"]

[paths]
# Arquivos que o agente nunca pode ler ou expor (entradas sem "/" casam pelo nome em qualquer diretório)
deny = [
    "~/.ssh",
    "~/.aws",
    "~/.gnupg",
    ".env",
    "/etc/shadow",
]

# Arquivos críticos do repositório que exigem aprovação para alteração
protected = [
    "policy.toml",
    "scripts/guardrail.py",
    ".agents/hooks.json",
    ".claude/settings.json",
    ".codex/hooks.json",
    ".cursor/hooks.json",
    ".gemini/settings.json",
]

# Caminhos do sistema permitidos para leitura segura ("~" expandido; "/**" opcional).
# Dentro de ~/data (Btrfs No-COW) a leitura só é liberada para estes caminhos e com os
# comandos de readonly_commands; escrita e qualquer outro acesso ao ~/data seguem perguntando.
readonly_system = [
    "/etc/os-release",
    "/proc/cpuinfo",
    "/proc/meminfo",
    # bring-up: cartões montados pelo leitor USB (logs de boot, dumps do aparelho)
    "/run/media",
]

# Comandos só de leitura aceitos nos caminhos de readonly_system dentro de ~/data
readonly_commands = ["rg", "ls", "fd", "sha256sum", "wc", "stat", "tree", "file", "cmp", "diff"]

# Diretórios de trabalho do harness (scratchpad, memória e planos): leitura e escrita liberadas
harness_allow = [
    "/tmp/claude-{uid}/**",
    "~/.claude/projects/**",
    "~/.claude/plans/**",
]

[toolchains.python]
canonical_runner = "uv run"
# Executores locais do .venv do workspace: funcionam mesmo quando a sandbox não monta ~/.local/bin/uv
sandbox_runners = [".venv/bin/ctx", ".venv/bin/python", ".venv/bin/python3"]
# Sem uv na máquina, o Python global pode ser usado APENAS para criar o .venv; todo o resto usa .venv/bin/python
bootstrap_allowed = ["python3 -m venv .venv", "python -m venv .venv"]
manager = "uv"
venv_path = ".venv"
forbidden_direct = [
    "python",
    "python3",
    "/usr/bin/python",
    "/usr/bin/python3",
    "/usr/local/bin/python",
    "/usr/local/bin/python3",
]
reason = "Python deve ser executado via 'uv run' ou pelo .venv do workspace ('.venv/bin/ctx' / '.venv/bin/python'), nunca pelo python global. Sem uv, o python da máquina serve só para criar o venv: 'python3 -m venv .venv'."

[toolchains.nodejs]
canonical_runner = "asdf exec"
manager = "asdf"
shims_dir = "~/.asdf/shims"
forbidden_direct = [
    "/usr/bin/node",
    "/usr/bin/npm",
    "/usr/bin/npx",
    "/usr/local/bin/node",
]
reason = "Node.js/npm/npx devem usar a versão gerenciada pelo asdf (~/.asdf/shims ou 'asdf exec')."

[containers]
prefer = "podman"
fallback = "docker"
policy = "container_first"

[storage.btrfs_nocow]
path = "~/data"
action = "ask"
reason = "Volumes pesados e bancos de dados devem consultar o usuário para uso de ~/data (No-COW)."

# --- ctx 0.4.0: seções novas (defaults comentados; descomente para customizar) ---
# ctx:section index
# [index]
# Escopo do índice (`ctx index`/`ctx search`). Padrões em código; listas aqui SUBSTITUEM a lista padrão.
# respect_gitignore = true            # usa `git ls-files`/.gitignore
# max_file_kb = 1024                  # arquivos maiores não são indexados
# extra_exclude_dirs = ["generated"]  # somam-se aos diretórios de build/cache/venv já excluídos
# exclude_globs = ["*.min.js"]
# journal_size_limit_mb = 8           # teto do arquivo -wal após cada checkpoint
# wal_autocheckpoint_pages = 200
#
# [index.reference]                   # material fora do git que vale buscar (dumps, documentação extraída)
# globs = ["reference/**/*.txt"]      # relativos à raiz do projeto (ou absolutos / com ~)
# max_file_kb = 4096

# Reference material for the R36S/GA36 bring-up (outside git). The patched kernel tree is
# .cache/src/linux-<version>-<patches digest> (the build cache, ignored by git); `r36os clean`
# removes old trees, so the wildcard matches a single tree. Only the display/DSI/PHY drivers and the Rockchip
# PX30/RK3326 device trees are indexed, never var/ (test ROMs).
[index.reference]
globs = [
  "out/r36s-factory/*.dts",
  "out/r36s-factory/boot.ini",
  ".cache/src/linux-6.18.62-*/drivers/gpu/drm/rockchip/*.[ch]",
  ".cache/src/linux-6.18.62-*/drivers/gpu/drm/bridge/synopsys/dw-mipi-dsi*.c",
  ".cache/src/linux-6.18.62-*/include/drm/bridge/dw_mipi_dsi.h",
  ".cache/src/linux-6.18.62-*/drivers/phy/rockchip/phy-rockchip-inno-dsidphy.c",
  ".cache/src/linux-6.18.62-*/drivers/gpu/drm/panel/panel-sitronix-st7703.c",
  ".cache/src/linux-6.18.62-*/drivers/gpu/drm/panel/panel-ga36mb-jd9366.c",
  ".cache/src/linux-6.18.62-*/arch/arm64/boot/dts/rockchip/px30*.dtsi",
  ".cache/src/linux-6.18.62-*/arch/arm64/boot/dts/rockchip/rk3326*.dts*",
]
max_file_kb = 4096

# ctx:section search
# [search]
# timeout_s = 3.0                     # nenhuma busca passa disso; ao estourar devolve o `rg` equivalente
# refresh = "off"                     # "off": a busca nunca escreve no índice | "incremental": atualiza com orçamento
# refresh_budget_ms = 300

# Local ctx prototype (docs/ctx/MELHORIAS.md, M-11): project glossary. Each group lists equivalent
# terms; a query that contains one of them is also tried with the first other term (BM25) and
# expanded with all of them (OR fallback and semantic search). Matching ignores case and accents.
[search]
glossary = [
  ["painel", "panel", "lcd", "display"],
  ["tela", "screen", "panel"],
  ["luz de fundo", "backlight", "pwm-backlight"],
  ["cinza", "grey", "gray"],
  ["zumbido", "whine", "hum"],
  ["taxa da lane", "lane rate", "lane_mbps"],
  ["sequencia de inicializacao", "init sequence", "init_sequence", "panel-init-sequence"],
  ["cartao", "card", "sdcard", "mmc"],
  ["leitor", "reader", "card reader"],
  ["corrompe", "corrupts", "corruption"],
  ["gravar", "flash", "write"],
  ["controle", "gamepad", "joypad"],
  ["botoes", "buttons", "gpio-keys"],
  ["analogico", "joystick", "adc-joystick"],
  ["som", "audio", "sound", "mixer"],
  ["alto-falante", "speaker", "spk"],
  ["fone", "headphones", "jack"],
  ["bateria", "battery"],
  ["desligar", "poweroff", "shutdown"],
  ["inicializacao", "boot"],
  ["registro", "log"],
  ["fabrica", "factory", "vendor", "stock"],
  ["relogio", "clock", "rtc"],
]

# ctx:section doctor
# [doctor]
# wal_max_mb = 64                     # WAL acima disso reprova o `ctx doctor` (`--fix` consolida)
# db_max_mb = 512
# search_max_ms = 500                 # uma busca de teste mais lenta que isso reprova
# stale_check = true                  # reprova se o índice estiver atrasado em relação aos arquivos/git

# ctx:section upstream
# Fontes upstream fixadas: `ctx upstream get <projeto> <versão> <caminho>` baixa UMA vez
# para .ctx/upstream/<projeto>/<versão>/<caminho> e indexa. Declare os projetos aqui (https apenas):
# [upstream.meu-projeto]
# base_url = "https://raw.githubusercontent.com/org/repo/{version}/{path}"   # {version} e {path} obrigatórios
# [upstream.meu-projeto.versions]     # opcional: URL base própria por versão (mesmos placeholders)
# v1 = "https://mirror.exemplo.org/repo/v1/{path}"

# Linux stable (the kernel is pinned to 6.18.62): version = stable tag, e.g. v6.18.62.
# The gregkh/linux mirror carries the stable tags; torvalds/linux has only the mainline ones.
[upstream.linux]
base_url = "https://raw.githubusercontent.com/gregkh/linux/{version}/{path}"

# ArkOS kernel 4.4.189 for RK3326 (christianhaitian/linux, branch rg351): the base of
# the factory kernel of the R36S V5 (a vendor build, "dev@rk3326 #310"). Reference for
# the display path of the factory system (task 4.6). version = commit sha, e.g.
# d8402159c04b1044106b4f27b7ed7c22ed09228f (rg351 HEAD on 2026-11-12).
[upstream.arkos-linux]
base_url = "https://raw.githubusercontent.com/christianhaitian/linux/{version}/{path}"

# ROCKNIX distribution (reference for RK3326 devices: R36S panel, DTS, patches).
# version = commit sha (preferred: the cache never refreshes) or a branch such as "next".
[upstream.rocknix]
base_url = "https://raw.githubusercontent.com/ROCKNIX/distribution/{version}/{path}"

# ctx:section recall
# Memória local entre sessões (`ctx recall`, `ctx fact`). Nada sai da máquina; `paths.deny` é respeitado.
# [recall]
# sources = [{ harness = "claude", path = "~/.claude/projects/{project}/*.jsonl" }]   # {project} = raiz do projeto normalizada
# capture_on_stop = false             # true: hook de parada gera candidatos a fato para `ctx fact review`
# redact = ["(?i)(api[_-]?key|token|secret|password)\\s*[=:]\\s*\\S+"]

# ctx:section recipes
# Receitas de várias etapas (`ctx recipe run <nome> [args]`). Cada etapa passa pelo guardrail; `deny` aborta.
# `copy-verify <origem> <destino>` já vem embutida (copiar, sincronizar, conferir sha256); redefina-a aqui se precisar.
# [recipes.minha-receita]
# description = "o que a receita faz"
# params = ["alvo"]
# steps = ["git status -s -b", "rg -n {alvo} src"]

# ctx:section metrics
# [metrics]
# events_log = true                   # .ctx/events.jsonl: latência por comando, receitas e recall (só local)
# events_max_kb = 1024
#
# [metrics.evaluate]                  # limiares e SUPOSIÇÕES de `ctx evaluate` (tokens são estimativas chars/4)
# min_sessions = 5                    # abaixo disso o veredito é "sem dados"
# min_group_sessions = 3              # mínimo por grupo (com/sem ctx) para comparar por modelo
# min_net_saving_tokens = 2000        # ganho líquido estimado por sessão para "compensa"
# tokens_per_call = 250               # custo médio de uma chamada de ferramenta evitada
# recall_hit_calls = 2                # chamadas que um acerto de recall/fato costuma evitar
# search_adoption_ok = 0.5            # fração de buscas via ctx (vs rg/grep/sed) para "compensa"
