odroidgoa-uboot-config

# Lume Retro OS: read by the factory U-Boot of the R36S from the BOOT partition.
# It loads the kernel and the DTB of the R36S and boots them. The initramfs is built into
# the kernel and the command line is fixed in it (CONFIG_CMDLINE_FORCE), so there is no
# uInitrd and no bootargs here. The GA36 never reads this file.

setenv loadaddr "0x02000000"
setenv dtb_loadaddr "0x01f00000"

load mmc 1:1 ${loadaddr} r36s/Image
load mmc 1:1 ${dtb_loadaddr} r36s/rk3326-r36s-v5.dtb

booti ${loadaddr} - ${dtb_loadaddr}
