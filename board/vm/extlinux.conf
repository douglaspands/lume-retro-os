# Lume Retro OS - VM x86_64 (SYSLINUX lê este arquivo com a mesma sintaxe do U-Boot).
# Boot verboso: sem "quiet". tty1 é o último console, então é o /dev/console;
# o kernel escreve nos dois e o rc-tee copia a lista de serviços para a serial.
DEFAULT lume
PROMPT 0
TIMEOUT 0

LABEL lume
	MENU LABEL Lume Retro OS (VM)
	LINUX /vmlinuz
	INITRD /initramfs
	APPEND root=PARTUUID=4c554d33-01 rootwait console=ttyS0,115200 console=tty1 video=640x480 loglevel=6
