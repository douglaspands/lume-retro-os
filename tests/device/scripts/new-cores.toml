description = "The cores of game-experience-tuning 10.5 and 11.5: the first game of each changed system opens in the expected core, runs 15 s and closes (no game is named)."
consoles = ["ga36", "r36s"]

[[step]]
name = "open the first megadrive game"
type = "open_game"
system = "megadrive"
position = 1

[[step]]
name = "started in genesis_plus_gx_lume"
type = "sh"
command = "sleep 15; cat /storage/logs/events.log /run/lume/logs/events.pending 2>/dev/null | grep ' game OK megadrive retroarch ' | grep ' start' | tail -n 1 | grep -q ' genesis_plus_gx_lume start'"

[[step]]
name = "close the game"
type = "close_game"

[[step]]
name = "open the first snes game"
type = "open_game"
system = "snes"
position = 1

