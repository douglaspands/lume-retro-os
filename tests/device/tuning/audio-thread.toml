# The audio driver with its own thread (game-experience-tuning 7.2, asked by the user on
# 2026-11-19 and widened to every core on 2026-11-20): alsathread moves the write to ALSA out of
# the core's thread. video_threaded stays as each board sets it (on) in A and B. One game per
# core, two in the arcade folder (fbneo is CPU bound there).
# Run: .venv/bin/python tests/device/tuning_ab.py audio-thread --console ga36 --measure 60
description = "A/B: audio_driver alsa (default) against alsathread, the default core of every system"
consoles = ["ga36", "r36s"]

[[core]]
core = "fbneo"
system = "arcade"
positions = [1, 2]

[[core.variant]]
name = "alsathread"
retroarch = { audio_driver = "alsathread" }

[[core]]
core = "fbalpha2012_cps1"
system = "cps1"
position = 1

[[core.variant]]
