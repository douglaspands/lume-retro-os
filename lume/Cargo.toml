# lume-launcher (openspec change lume-launcher, D2): the launcher of Lume Retro OS.
#   lume-core   catalog (schema 3), runners, options in 3 layers, index format, settings
#   lume-index  scan, gamelist.xml diff, binary index, thumbnails
#   lume-ui     the interface (SDL2 behind the Canvas trait)
#   lume-run    the supervisor that runs a game and brings the interface back
#   lume-menu   the Lume menu over a game, drawn by the system (lume-hud-actions D14)
[workspace]
# MSRV-aware: the lock keeps crate versions that build with the rust-version below
resolver = "3"
members = ["lume-core", "lume-index", "lume-ui", "lume-run", "lume-menu"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
# rustc of Alpine 3.24 (task 1.3)
rust-version = "1.96"

[workspace.dependencies]
lume-core = { path = "lume-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
