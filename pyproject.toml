[project]
name = "lume-tool"
version = "0.1.0"
description = "Orquestrador de build e da VM da distro Alpine + RetroArch para R36S e GA36"
readme = "README.md"
requires-python = ">=3.14"  # compression.zstd (imagens arquivadas e initramfs)
dependencies = []

[project.scripts]
lume = "lume_tool.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
# the repository root, so tests import each other (from tests.unit.x import ...)
pythonpath = ["."]
