# GA36-MB V1.2 built-in gamepad (kernel driver ga36mb-gamepad, kernel/patches/0006).
# Button indices are those RetroArch's udev driver assigns: keys in code order from
# BTN_MISC (BTN_A 0x130 ... BTN_THUMBR 0x13e, then BTN_DPAD_UP 0x220 ... RIGHT 0x223).
# Face buttons follow the printed labels (SNES layout): A right, B bottom, X top, Y left.
input_driver = "udev"
input_device = "GA36-MB Gamepad"
input_device_display_name = "GA36-MB Gamepad"

input_a_btn = "0"
input_b_btn = "1"
input_x_btn = "2"
input_y_btn = "3"
input_l_btn = "4"
input_r_btn = "5"
input_l2_btn = "6"
input_r2_btn = "7"
input_select_btn = "8"
input_start_btn = "9"
input_l3_btn = "11"
input_r3_btn = "12"
input_up_btn = "13"
input_down_btn = "14"
input_left_btn = "15"
input_right_btn = "16"

# Fn opens the menu (Start + Select also does, retroarch-lume.cfg)
input_menu_toggle_btn = "10"

# Sticks: 0..255 around 128; the driver already flips the mirrored left stick
input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"
input_r_x_plus_axis = "+2"
input_r_x_minus_axis = "-2"
input_r_y_plus_axis = "+3"
input_r_y_minus_axis = "-3"

input_a_btn_label = "A"
input_b_btn_label = "B"
input_x_btn_label = "X"
input_y_btn_label = "Y"
input_menu_toggle_btn_label = "Fn"
