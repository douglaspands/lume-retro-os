# Lume Retro OS: GA36 RetroArch settings, appended after retroarch-lume.cfg by the
# frontend (frontends/retroarch reads the board from /etc/r36os/board).

# No keyboard on the GA36: the common config makes right Shift the "enable hotkey" key for
# the VM keyboard (where S is both the X button and the menu hotkey). With a keyboard
# enable-hotkey key bound, RetroArch blocks every keyboard hotkey until that key is held
# (input/input_driver.c), and the volume buttons are keyboard keys (LRADC). Cleared here,
# no hotkey is blocked: the volume buttons work, and Fn and Start + Select still open
# the menu.
input_enable_hotkey = "nul"
