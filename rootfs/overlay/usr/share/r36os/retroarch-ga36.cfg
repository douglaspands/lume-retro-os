# Lume Retro OS: GA36 RetroArch settings, appended after retroarch-lume.cfg by the
# frontend (frontends/retroarch reads the board from /etc/r36os/board).

# No keyboard on the GA36: the common config makes right Shift the "enable hotkey" key for
# the VM keyboard (where S is both the X button and the menu hotkey). With a keyboard
# enable-hotkey key bound, RetroArch blocks every keyboard hotkey until that key is held
# (input/input_driver.c), and the volume buttons are keyboard keys (LRADC). Cleared here,
# no hotkey is blocked: the volume buttons work, and Fn and Start + Select still open
# the menu.
input_enable_hotkey = "nul"

# Real panel refresh: the JD9366 mode (both panels) is 30 MHz / (1040 x 518) = 55.687557 Hz,
# the vendor FEX timing. RetroArch assumes 60 Hz by default; a 59.73-60.10 fps core is then
# within audio_max_timing_skew, so RetroArch paces the game by vsync (really 55.69 fps) and
# scales the audio input rate for 60 Hz. The core then makes about 7% fewer samples than ALSA
# plays, more than dynamic rate control (0.5%) can absorb, and the buffer underruns all the
# time: the crackle. With the real rate the skew is above the 5% limit, so RetroArch paces
# by the audio instead: the game keeps its speed, the sound is continuous, and a few frames
# are dropped.
video_refresh_rate = "55.687557"
