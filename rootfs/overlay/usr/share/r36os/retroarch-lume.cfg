# Lume Retro OS: configuração fixa do RetroArch (--appendconfig, vale sobre a do usuário).
# Menu e tema ficam no padrão do RetroArch (Ozone); só o que a distro precisa está aqui.

# Vídeo: KMS/DRM + GLES, tela cheia, sem X11/Wayland
video_driver = "gl"
video_context_driver = "kms"
video_fullscreen = "true"
video_vsync = "true"
video_threaded = "false"
audio_driver = "alsa"
input_driver = "udev"
input_joypad_driver = "udev"
input_autodetect_enable = "true"
joypad_autoconfig_dir = "/usr/share/libretro/autoconfig"

# Contrato de pastas (ROMS)
rgui_browser_directory = "/storage/roms"
system_directory = "/storage/bios"
savefile_directory = "/storage/saves"
savestate_directory = "/storage/states"
sort_savefiles_by_content_enable = "true"
sort_savestates_by_content_enable = "true"
sort_savefiles_enable = "false"
sort_savestates_enable = "false"
screenshot_directory = "/storage/screenshots"
playlist_directory = "~/.config/retroarch/playlists"
libretro_directory = "/usr/lib/libretro"
libretro_info_path = "/usr/share/libretro/info"
assets_directory = "/usr/share/libretro/assets"

# Comandos de rede (UDP 55355): os logs de diagnóstico (r36os-logd) leem o estado do
# jogo com GET_STATUS. Os consoles não têm rede nesta versão.
network_cmd_enable = "true"
network_cmd_port = "55355"

# Menu padrão (Ozone). O idioma e a escala do menu e da fonte ficam na configuração de
# fábrica do usuário (factory/retroarch/retroarch.cfg): aqui venceriam o ajuste do menu.
menu_driver = "ozone"
menu_pause_libretro = "true"

# No transparency in the menu: blending the menu over the game costs GPU time and the
# hardware is simple (Mali-400). Fixed here (not in the user config) so it also reaches
# cards that already have a saved config.
menu_framebuffer_opacity = "1.000000"
menu_wallpaper_opacity = "1.000000"
menu_header_opacity = "1.000000"
menu_footer_opacity = "1.000000"
menu_rgui_transparency = "false"
video_msg_bgcolor_opacity = "1.000000"

# Os cores do atualizador online são compilados para glibc e não rodam no Alpine (musl)
menu_show_core_updater = "false"

# Atalhos: Start + Select abre o menu; nenhuma combinação encerra o RetroArch
# (sair pelo menu desliga o aparelho).
input_menu_toggle_gamepad_combo = "4"
input_quit_gamepad_combo = "0"
# Safety: shutting down asks for confirmation. The "Shut Down" menu item has to be
# selected twice within 3 s (aports/retroarch patch 0002); the first time it only shows
# "Press again to shut down...". The self-test turns this off for itself (retroarch-extra.cfg),
# because it quits with the network command QUIT, which goes through the hotkey path.
quit_press_twice = "true"
input_exit_emulator = "nul"
input_exit_emulator_btn = "nul"
input_exit_emulator_axis = "nul"

# Volume keys: the consoles' volume buttons are keys KEY_VOLUMEUP/KEY_VOLUMEDOWN (GA36:
# LRADC), which RetroArch names "volumeup"/"volumedown" (input/input_keymaps.c). Upstream
# binds volume to the keypad +/-, so the buttons did nothing. On a board whose
# input_enable_hotkey is a keyboard key, keyboard hotkeys need that key held: the GA36 has
# no keyboard, so retroarch-ga36.cfg clears it.
input_volume_up = "volumeup"
input_volume_down = "volumedown"

# Teclado (VM): o mesmo layout do controle dos consoles.
#   setas = direcional  X = A  Z = B  S = X  A = Y  Q/W = L1/R1  E/R = L2/R2
#   Enter = Start  Shift direito = Select  (Select + S = menu)
input_player1_up = "up"
input_player1_down = "down"
input_player1_left = "left"
input_player1_right = "right"
input_player1_a = "x"
input_player1_b = "z"
input_player1_x = "s"
input_player1_y = "a"
input_player1_l = "q"
input_player1_r = "w"
input_player1_l2 = "e"
input_player1_r2 = "r"
input_player1_start = "enter"
input_player1_select = "rshift"
input_enable_hotkey = "rshift"
input_menu_toggle = "s"
