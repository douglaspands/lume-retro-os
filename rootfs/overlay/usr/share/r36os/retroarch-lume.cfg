# Lume Retro OS: configuração fixa do RetroArch (--appendconfig, vale sobre a do usuário).

# Vídeo: KMS/DRM + GLES, tela cheia, sem X11/Wayland
video_driver = "gl"
video_context_driver = "kms"
video_fullscreen = "true"
video_vsync = "true"
video_threaded = "false"
video_font_enable = "true"
audio_driver = "alsa"
input_driver = "udev"
input_joypad_driver = "udev"
input_autodetect_enable = "true"
joypad_autoconfig_dir = "/usr/share/r36os/autoconfig"

# Contrato de pastas (ROMS)
rgui_browser_directory = "/storage/roms"
system_directory = "/storage/bios"
savefile_directory = "/storage/saves"
savestate_directory = "/storage/states"
sort_savefiles_by_content_enable = "true"
sort_savestates_by_content_enable = "true"
sort_savefiles_enable = "false"
sort_savestates_enable = "false"
screenshot_directory = "/storage/screenshots"
playlist_directory = "~/.config/retroarch/playlists"
libretro_directory = "/usr/lib/libretro"
libretro_info_path = "/usr/share/libretro/info"
savestate_auto_index = "false"

# Idioma do menu: português do Brasil (RETRO_LANGUAGE_PORTUGUESE_BRAZIL)
user_language = "7"

# Tema Lume no XMB (assets próprios, sem o retroarch-assets completo).
# xmb_theme 6 = XMB_ICON_THEME_CUSTOM no RetroArch 1.22 (ícones em xmb/custom/png).
menu_driver = "xmb"
assets_directory = "/usr/share/r36os/retroarch-assets"
xmb_theme = "6"
xmb_font = "/usr/share/r36os/retroarch-assets/xmb/custom/font.ttf"
menu_wallpaper = "/usr/share/r36os/retroarch-assets/xmb/custom/png/bg.png"
menu_wallpaper_opacity = "1.000000"
menu_dynamic_wallpaper_enable = "false"
xmb_shadows_enable = "false"
menu_shader_pipeline = "0"
# 10 = XMB_THEME_WALLPAPER: sem ele o XMB ignora um wallpaper chamado bg.png
xmb_menu_color_theme = "10"
menu_font_color_red = "242"
menu_font_color_green = "245"
menu_font_color_blue = "247"
xmb_scale_factor = "100"
xmb_alpha_factor = "75"
menu_thumbnails = "0"
menu_left_thumbnails = "0"
xmb_vertical_thumbnails = "false"
menu_timedate_enable = "false"
menu_battery_level_enable = "true"
menu_core_enable = "false"
menu_show_sublabels = "false"
menu_pause_libretro = "true"
menu_savestate_resume = "true"
pause_nonactive = "false"
menu_swap_ok_cancel_buttons = "false"
menu_scroll_fast = "true"

# Menu enxuto (kiosk): sistemas com jogos, histórico, favoritos e configurações
content_show_history = "true"
content_show_favorites = "true"
content_show_settings = "true"
content_show_playlist_tabs = "true"
content_show_playlists = "false"
content_show_add = "false"
content_show_add_entry = "0"
content_show_explore = "false"
content_show_contentless_cores = "0"
content_show_netplay = "false"
content_show_music = "false"
content_show_video = "false"
content_show_images = "false"
menu_show_online_updater = "false"
menu_show_core_updater = "false"
menu_show_load_core = "false"
menu_show_load_content = "false"
menu_show_load_disc = "false"
menu_show_dump_disc = "false"
menu_show_eject_disc = "false"
menu_show_information = "false"
menu_show_configurations = "false"
menu_show_help = "false"
menu_show_restart_retroarch = "false"
menu_show_reboot = "false"
menu_show_shutdown = "false"
menu_show_quit_retroarch = "true"
menu_show_core_manager_steam = "false"
menu_show_legacy_thumbnail_updater = "false"
menu_show_latency = "false"
menu_show_advanced_settings = "false"
settings_show_network = "false"
settings_show_playlists = "false"
settings_show_achievements = "false"
settings_show_drivers = "false"
settings_show_recording = "false"
settings_show_user = "false"
settings_show_directory = "false"
settings_show_ai_service = "false"
settings_show_accessibility = "false"
settings_show_logging = "false"
settings_show_file_browser = "false"
settings_show_configuration = "false"
settings_show_steam = "false"
settings_show_power_management = "false"
quick_menu_show_start_recording = "false"
quick_menu_show_start_streaming = "false"
quick_menu_show_download_thumbnails = "false"
quick_menu_show_add_to_playlist = "false"
quick_menu_show_game_ai = "false"
quick_menu_show_replay = "false"
quick_menu_show_save_core_overrides = "true"
quick_menu_show_save_game_overrides = "true"

# Atalhos: Select + X abre o menu; nenhuma combinação encerra o RetroArch.
input_menu_toggle_gamepad_combo = "0"
input_quit_gamepad_combo = "0"
quit_press_twice = "false"
input_exit_emulator = "nul"
input_exit_emulator_btn = "nul"
input_exit_emulator_axis = "nul"

# Teclado (VM): o mesmo layout do controle dos consoles.
#   setas = direcional  X = A  Z = B  S = X  A = Y  Q/W = L1/R1  E/R = L2/R2
#   Enter = Start  Shift direito = Select  (Select + S = menu)
input_player1_up = "up"
input_player1_down = "down"
input_player1_left = "left"
input_player1_right = "right"
input_player1_a = "x"
input_player1_b = "z"
input_player1_x = "s"
input_player1_y = "a"
input_player1_l = "q"
input_player1_r = "w"
input_player1_l2 = "e"
input_player1_r2 = "r"
input_player1_start = "enter"
input_player1_select = "rshift"
input_enable_hotkey = "rshift"
input_menu_toggle = "s"
input_toggle_fullscreen = "nul"
input_hold_fast_forward = "nul"
input_toggle_fast_forward = "nul"
input_load_state = "nul"
input_save_state = "nul"
input_screenshot = "nul"
input_pause_toggle = "nul"
input_reset = "nul"
