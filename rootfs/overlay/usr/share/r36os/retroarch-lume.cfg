# Lume Retro OS: fixed RetroArch configuration, written into the user's config by the
# frontend script (frontends/retroarch) on every start. Only what keeps the system working stays here: drivers, folders, the
# network command, the shutdown behaviour and the way into the menu. Everything a user may
# want to tune (video, menu look, binds, volume keys) is a factory default in
# factory/retroarch/retroarch.cfg instead, so a change made in the menu is saved on the
# card (ROMS/system/retroarch/) and survives restarts and new images.

# Video: KMS/DRM + GLES, full screen, no X11/Wayland
video_driver = "gl"
video_context_driver = "kms"
video_fullscreen = "true"
audio_driver = "alsa"
input_driver = "udev"
input_joypad_driver = "udev"
input_autodetect_enable = "true"
joypad_autoconfig_dir = "/usr/share/libretro/autoconfig"

# Folder contract (ROMS)
rgui_browser_directory = "/storage/roms"
system_directory = "/storage/bios"
savefile_directory = "/storage/saves"
savestate_directory = "/storage/states"
sort_savefiles_by_content_enable = "true"
sort_savestates_by_content_enable = "true"
sort_savefiles_enable = "false"
sort_savestates_enable = "false"
screenshot_directory = "/storage/screenshots"
playlist_directory = "~/.config/retroarch/playlists"
libretro_directory = "/usr/lib/libretro"
libretro_info_path = "/usr/share/libretro/info"
assets_directory = "/usr/share/libretro/assets"

# Network commands (UDP 55355): the diagnostic logs (r36os-logd) read the game state and
# the frame counter with GET_STATUS. The consoles have no network in this version.
network_cmd_enable = "true"
network_cmd_port = "55355"

# The online updater cores are built for glibc and do not run on Alpine (musl)
menu_show_core_updater = "false"

# Shortcuts: Start + Select opens the menu; no combination quits RetroArch (quitting from
# the menu shuts the console down). Fixed so the menu can always be reached.
input_menu_toggle_gamepad_combo = "4"
input_quit_gamepad_combo = "0"
# Safety: shutting down asks for confirmation. The "Shut Down" menu item has to be
# selected twice within 3 s (aports/retroarch patch 0002); the first time it only shows
# "Press again to shut down...". The self-test turns this off for itself (retroarch-extra.cfg),
# because it quits with the network command QUIT, which goes through the hotkey path.
quit_press_twice = "true"
input_exit_emulator = "nul"
input_exit_emulator_btn = "nul"
input_exit_emulator_axis = "nul"

# Menu text size: Ozone caps its layout on a 640x480 screen, so the menu scale does nothing
# there and the text size comes only from the font scale. Fixed to Global (1, numeric:
# "true" would read as 0) because it kept turning itself off; the size itself, the global
# factor ozone_font_scale_factor_global, stays a user setting (factory config).
ozone_font_scale = "1"

# Keyboard hotkeys need this key held (VM keyboard: right Shift, with Select + S = menu).
# Boards without a keyboard clear it in retroarch-<board>.cfg, or the volume buttons
# (keyboard keys) would be blocked.
input_enable_hotkey = "rshift"
