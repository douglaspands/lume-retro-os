# Lume Retro OS: factory user configuration.
# Copied to ROMS/system/retroarch/ on the first boot of a card; from then on RetroArch saves
# every change made in the menu there, and new images never overwrite it. Only drivers,
# folders and shutdown/menu safety are fixed (/usr/share/r36os/retroarch-lume.cfg, written
# into the user config on every start). Everything below is a default the user can change
# in the menu, and "Reset to Default Config" returns to it.
config_save_on_exit = "true"

# Factory menu language: set at build time (r36os build <target> --lang <code>, default
# English = 0). A language chosen in the menu is kept across images.
user_language = "0"

# Menu (Ozone, the RetroArch default) readable on a 3.5" 640x480 screen. The KMS context
# reports no DPI (drm_ctx.c has no get_metrics), so the base scale is the pixel diagonal
# over 1080p: 800 / 2203 = 0.363. Ozone caps its layout at a sidebar of a third of the
# width: 408 px * scale <= 640 / 3, so scale <= 0.523, reached at a menu_scale_factor of
# 0.523 / 0.363 = 1.44. 1.5 is that maximum; any higher factor gives the same menu, and a
# lower one shrinks it (1.0 is 69% of it). The text size also grows with the global font
# factor below; the font scale mode itself is fixed to Global in retroarch-lume.cfg.
menu_driver = "ozone"
menu_scale_factor = "1.500000"
ozone_font_scale_factor_global = "1.200000"
menu_pause_libretro = "true"
# Menu buttons not swapped: A confirms and B goes back, as printed on the console.
# RetroArch 1.22 swaps them by default (DEFAULT_MENU_SWAP_OK_CANCEL_BUTTONS true).
menu_swap_ok_cancel_buttons = "false"
# No clock in the menu header: the consoles have no battery-backed RTC and no network, so
# they boot in 1970 and the clock would be wrong. A user default (Settings > User Interface
# > Show Date / Time turns it back on, and the choice is saved on the card), not a fixed key.
menu_timedate_enable = "false"

# No transparency in the menu: blending the menu over the game costs GPU time and the
# hardware is simple (Mali-400).
menu_framebuffer_opacity = "1.000000"
menu_wallpaper_opacity = "1.000000"
menu_header_opacity = "1.000000"
menu_footer_opacity = "1.000000"
menu_rgui_transparency = "false"
video_msg_bgcolor_opacity = "1.000000"

# Video
video_vsync = "true"
video_threaded = "false"

# Volume keys: the consoles' volume buttons are keys KEY_VOLUMEUP/KEY_VOLUMEDOWN (GA36:
# LRADC), which RetroArch names "volumeup"/"volumedown" (input/input_keymaps.c). Upstream
# binds volume to the keypad +/-, so the buttons did nothing.
input_volume_up = "volumeup"
input_volume_down = "volumedown"

# Keyboard (VM): the same layout as the consoles' controller.
#   arrows = d-pad  X = A  Z = B  S = X  A = Y  Q/W = L1/R1  E/R = L2/R2
#   Enter = Start  right Shift = Select  (Select + S = menu)
input_player1_up = "up"
input_player1_down = "down"
input_player1_left = "left"
input_player1_right = "right"
input_player1_a = "x"
input_player1_b = "z"
input_player1_x = "s"
input_player1_y = "a"
input_player1_l = "q"
input_player1_r = "w"
input_player1_l2 = "e"
input_player1_r2 = "r"
input_player1_start = "enter"
input_player1_select = "rshift"
input_menu_toggle = "s"
