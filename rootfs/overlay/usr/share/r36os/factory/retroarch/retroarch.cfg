# Lume Retro OS: configuração de fábrica do usuário.
# Este arquivo vai para ROMS/system/retroarch/ no primeiro boot e guarda o que o
# usuário mudar no menu. O tema, o modo kiosk, os atalhos e as pastas vêm de
# /usr/share/r36os/retroarch-lume.cfg (carregado com --appendconfig).
config_save_on_exit = "true"
