# Lume Retro OS: configuração de fábrica do usuário.
# Este arquivo vai para ROMS/system/retroarch/ no primeiro boot e guarda o que o
# usuário mudar no menu. Vídeo, pastas e atalhos vêm de
# /usr/share/r36os/retroarch-lume.cfg (carregado com --appendconfig, vale sobre este).
# O que o usuário pode mudar no menu fica aqui, e não no retroarch-lume.cfg, para o
# ajuste valer e ser persistido.
config_save_on_exit = "true"

# Idioma do menu de fábrica: definido no build (r36os build <alvo> --lang <código>,
# padrão inglês = 0).
user_language = "0"

# Menu legível numa tela de 3,5" a 640x480 (Interface do usuário > Escala).
# Não definir ozone_font_scale: é numérico (não booleano) e "true" vira 0 (testado com o
# RetroArch 1.22.2 da imagem), o que ignorava o fator global abaixo.
menu_scale_factor = "1.500000"
ozone_font_scale_factor_global = "1.200000"
