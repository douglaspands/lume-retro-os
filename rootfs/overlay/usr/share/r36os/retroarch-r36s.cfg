# Lume Retro OS: R36S RetroArch settings, appended after retroarch-lume.cfg by the
# frontend (frontends/retroarch reads the board from /etc/r36os/board). The frontend writes
# these keys into the user config on every start, so on the single card each console gets
# its own values back after the other one ran (r36s-single-card, frontend-session).
# Every key fixed here is fixed for the GA36 too (retroarch-ga36.cfg), and the other way.

# No keyboard on the R36S, and the volume buttons are keyboard keys (gpio-keys): with a
# keyboard enable-hotkey key bound, RetroArch would block them until that key is held.
input_enable_hotkey = "nul"

# Panel refresh from the kernel mode of the ST7703 variant (60 Hz timing of the factory
# device tree): 27 MHz / (890 x 514) = 59.021554 Hz. To be confirmed on the device (task
# 9.5), as the GA36 value was; a wrong rate starves the audio buffer (see retroarch-ga36.cfg).
video_refresh_rate = "59.021554"
