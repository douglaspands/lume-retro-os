# Lume Retro OS: replaces Alpine's /usr/lib/sysctl.d/00-alpine.conf (OpenRC's sysctl service
# skips a /usr/lib file when /etc/sysctl.d has one with the same name). Alpine's file sets
# network hardening keys (net.ipv4.tcp_syncookies, net.ipv6.*) and
# kernel.unprivileged_bpf_disabled, which the console kernel does not have (no IPv6, no
# bpf syscall): every boot logged one error per key (task 9.11). The consoles have no
# network in this version; only the keys every target kernel has are kept.

# Restarts the computer 120 seconds after a kernel panic
kernel.panic = 120

# Users cannot create links to files they do not own (privilege escalation mitigations)
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
