# R36S V5 (lume-input profile): the built-in buttons (gpio-keys) and sticks (adc-joystick)
# joined into "R36S Gamepad", plus the volume buttons (volume-keys), all grabbed.
# The face buttons follow the printed labels as on the GA36: A (right) is BTN_A, B (bottom)
# is BTN_B. F1-F5 have no fixed meaning in the DTS; F5 is the Fn key (BTN_MODE).
name R36S Gamepad
id 0x1209 0x3653
source gpio-keys
source-optional adc-joystick
source-optional volume-keys
# the power button of the RK817 (rk805-pwrkey driver, input name "rk805 pwrkey", KEY_POWER):
# tap = suspend, held 2 s = power off (device-fixes D11); never forwarded
power rk805 pwrkey

key BTN_EAST BTN_A
key BTN_SOUTH BTN_B
key BTN_NORTH BTN_X
key BTN_WEST BTN_Y
key BTN_TL BTN_TL
key BTN_TR BTN_TR
key BTN_TL2 BTN_TL2
key BTN_TR2 BTN_TR2
key BTN_DPAD_UP BTN_DPAD_UP
key BTN_DPAD_DOWN BTN_DPAD_DOWN
key BTN_DPAD_LEFT BTN_DPAD_LEFT
key BTN_DPAD_RIGHT BTN_DPAD_RIGHT
key BTN_TRIGGER_HAPPY1 BTN_SELECT
key BTN_TRIGGER_HAPPY2 BTN_START
key BTN_TRIGGER_HAPPY3 BTN_THUMBL
key BTN_TRIGGER_HAPPY4 BTN_THUMBR
key BTN_TRIGGER_HAPPY5 BTN_MODE

axis ABS_X
axis ABS_Y
axis ABS_RX
axis ABS_RY
# the dead zone around the calibrated centre, in % of the axis span (device-fixes D17)
deadzone 5

fn BTN_MODE
# the Fn chords (lume-hud-actions D1, D13): tap Fn = Lume menu, hold Fn = the chord hint,
# Fn + key = the action (output codes); other Fn chords are reserved and do nothing
fn_hold_ms 500
chord BTN_B app_menu
chord BTN_TR save_state
chord BTN_TL load_state
chord BTN_Y screenshot
chord BTN_X hud
chord BTN_START quit
# Volume (device-fixes D9, task 7.2): the digital Master of the RK817 (rk817_codec.c: 0-255,
# -95 dB to 0 dB) until task 7.1 measures an analog gain; 7.1 swaps only this control, its
# scale line and raw_of_percent/set_output_gain of the jack service. Keys move 5% of the
# user scale (volume.h) on the active output (speaker or headphones, written by the jack
# service); no switch on this control, 0% is its minimum.
mixer rk817int Master 5
mixer_scale 0 255 255 373
