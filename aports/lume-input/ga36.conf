# GA36-MB V1.2 (lume-input profile): the kernel gamepad (ga36mb-gamepad, kernel patch
# 0006) is grabbed and published again under the same name, so the RetroArch autoconfig
# stays; the volume buttons (LRADC) are grabbed too. The virtual device is told apart from
# the source by its bus (BUS_VIRTUAL).
name GA36-MB Gamepad
id 0x1209 0x3633
source GA36-MB Gamepad
source-optional 1c22800.lradc
# the power button of the AXP22x PMIC (axp221-pek node, input name axp20x-pek, KEY_POWER):
# tap = suspend, held 2 s = power off (device-fixes D11); never forwarded
power axp20x-pek

key BTN_A BTN_A
key BTN_B BTN_B
key BTN_X BTN_X
key BTN_Y BTN_Y
key BTN_TL BTN_TL
key BTN_TR BTN_TR
key BTN_TL2 BTN_TL2
key BTN_TR2 BTN_TR2
key BTN_DPAD_UP BTN_DPAD_UP
key BTN_DPAD_DOWN BTN_DPAD_DOWN
key BTN_DPAD_LEFT BTN_DPAD_LEFT
key BTN_DPAD_RIGHT BTN_DPAD_RIGHT
key BTN_SELECT BTN_SELECT
key BTN_START BTN_START
key BTN_THUMBL BTN_THUMBL
key BTN_THUMBR BTN_THUMBR
key BTN_MODE BTN_MODE

axis ABS_X
axis ABS_Y
axis ABS_RX
axis ABS_RY
# the dead zone around the calibrated centre, in % of the axis span (device-fixes D17)
deadzone 5

fn BTN_MODE
# the Fn chords (lume-hud-actions D1, D13): tap Fn = Lume menu, hold Fn = the chord hint,
# Fn + key = the action (output codes); other Fn chords are reserved and do nothing
fn_hold_ms 500
chord BTN_B app_menu
chord BTN_TR save_state
chord BTN_TL load_state
chord BTN_Y screenshot
chord BTN_X hud
chord BTN_START quit
# Volume (device-fixes D9, task 7.2): the analog Headphone gain of sun8i-codec-analog, which
# also feeds the speaker amplifier; 0-63 at 1 dB per step (the driver's TLV: 63 is 0 dB, 54 is
# -9 dB), 54 is the loudest clean one on the speaker with a full-scale game (judged by the
# user, 2026-11-18: 55 and up distort; the 2.5 J1 test tone was too quiet to show it). Keys move 5% of the user scale (volume.h); 0% turns the Headphone
# switch off. The digital DAC stays at 0 dB (160) and on, set again at every step; before
# 7.2 it was the volume control, so a level-speaker file that does not exist yet comes from
# the DAC while it is not at 0 dB (the one-time conversion). One level only, "speaker": the
# jack switch is mechanical.
mixer GA36MB Headphone 5
mixer_scale 0 63 54 1000
mixer_switch
mixer_keep DAC 160 on
# The speaker amplifier switch (device-fixes 7.5): at 0% the Headphone is off but the amplifier
# (DAPM GPIO) stays on and hisses; 0% turns "Speaker" off too, any other level turns it on.
mixer_amp Speaker
mixer_old DAC 0 192 160 750
# Backlight (raw 0-10): high levels can show a broken picture on this GA36 (P-95: with heat,
# and at level 7 right after a resume even cold). The user chose all 10 levels with the risky
# zone shown on the bar (2026-11-18, launcher-adjustments) instead of a fixed ceiling; with no
# saved brightness the start brings a higher level down to 7 (the device tree starts at 7 since
# device-fixes 9.16; an older kernel started at 8).
backlight_boot 7
