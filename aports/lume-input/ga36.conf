# GA36-MB V1.2 (lume-input profile): the kernel gamepad (ga36mb-gamepad, kernel patch
# 0006) is grabbed and published again under the same name, so the RetroArch autoconfig
# stays; the volume buttons (LRADC) are grabbed too. The virtual device is told apart from
# the source by its bus (BUS_VIRTUAL).
name GA36-MB Gamepad
id 0x1209 0x3633
source GA36-MB Gamepad
source-optional 1c22800.lradc

key BTN_A BTN_A
key BTN_B BTN_B
key BTN_X BTN_X
key BTN_Y BTN_Y
key BTN_TL BTN_TL
key BTN_TR BTN_TR
key BTN_TL2 BTN_TL2
key BTN_TR2 BTN_TR2
key BTN_DPAD_UP BTN_DPAD_UP
key BTN_DPAD_DOWN BTN_DPAD_DOWN
key BTN_DPAD_LEFT BTN_DPAD_LEFT
key BTN_DPAD_RIGHT BTN_DPAD_RIGHT
key BTN_SELECT BTN_SELECT
key BTN_START BTN_START
key BTN_THUMBL BTN_THUMBL
key BTN_THUMBR BTN_THUMBR
key BTN_MODE BTN_MODE

axis ABS_X
axis ABS_Y
axis ABS_RX
axis ABS_RY

fn BTN_MODE
# the Fn chords (lume-hud-actions D1, D13): tap Fn = Lume menu, hold Fn = the chord hint,
# Fn + key = the action (output codes); other Fn chords are reserved and do nothing
fn_hold_ms 500
chord BTN_B app_menu
chord BTN_TR save_state
chord BTN_TL load_state
chord BTN_Y screenshot
chord BTN_X hud
chord BTN_START quit
# sun8i-codec: digital DAC volume (lume-mixer sets it to 160 = 0 dB); the step is checked
# on the device (task 9.5). Ceiling 160: above 0 dB the digital gain clips (Vol+ reached
# 166 = +4.5 dB on the GA36, 2026-11-14)
mixer GA36MB DAC 3 160
# Backlight ceiling (raw level of 0-10): above it the panel flickers and shows broken parts of
# the picture, with any system (seen with EmuELEC too), on battery as well, and not from heat
# (42 C) nor the PWM (level 10 is steady light and flickers as well). Level 8 looked steady,
# then flickered again after a while; the user set 7 (2026-11-15). Level 7 is the launcher's
# 100%, and lume-input brings a higher level down to it when it starts.
backlight_max 7
