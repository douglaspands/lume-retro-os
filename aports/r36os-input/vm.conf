# VM (r36os-input profile): the QEMU keyboard is grabbed and published again as a virtual
# keyboard with every key, so the self-test exercises the same code as the consoles. F1
# plays the Fn key (it is also the RetroArch menu key) and Enter plays Start; the volume
# keys of the keyboard change the HDA mixer.
name Lume VM Keyboard
id 0x1209 0x3600
source AT Translated Set 2 keyboard
passthrough

fn KEY_F1
quit KEY_ENTER
mixer 0 Master 5
