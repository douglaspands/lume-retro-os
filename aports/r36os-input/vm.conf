# VM (r36os-input profile): the QEMU keyboard is grabbed and published again as a virtual
# keyboard with every key, so the self-test exercises the same code as the consoles. F1
# plays the Fn key and the chords use the keys that play the gamepad (lume-ui's input.rs:
# Z = B, W = R1, Q = L1, A = Y, S = X, Enter = Start); the volume keys of the keyboard change
# the HDA mixer.
name Lume VM Keyboard
id 0x1209 0x3600
source AT Translated Set 2 keyboard
passthrough

fn KEY_F1
fn_hold_ms 500
chord KEY_Z app_menu
chord KEY_W save_state
chord KEY_Q load_state
chord KEY_A screenshot
chord KEY_S hud
chord KEY_ENTER quit
mixer 0 Master 5
