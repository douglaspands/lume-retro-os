# Suspension of the GA36 (openspec device-fixes D11; read by lume-sleep, lume_core::sleep).
# mode freeze | mem. Measured on the GA36 (2.3, J1, 2026-11-18): /sys/power/mem_sleep offers
# only [s2idle]; freeze woke by the power button 10 of 10 times.
mode freeze

# Wakeup sources that must not wake the console (task 8.1): lume-sleep sets their
# power/wakeup to disabled before the suspension and back to enabled after it. Paths under
# /sys. The wakeup sources of the J1 and how each one is handled:
#   axp221-pek        the power button: the only one left (the driver enables it itself)
#   axp20x-usb        the AXP USB input, which is the DC charging port: plugging the charger
#                     raised VBUS_PLUGIN as a wakeup, and its polling (AXP221/223) called
#                     power_supply_changed() during the freeze
nowake class/power_supply/axp20x-usb
#   axp20x-battery    no interrupt of its own; its wakeup source only held by a change event
nowake class/power_supply/axp20x-battery
#   1f00000.rtc       the RTC alarm: nothing in the system sets one (no rtcwake, no alarm timers)
nowake bus/platform/devices/1f00000.rtc
#   alarmtimer        only arms the RTC above, which no longer wakes
#   mmc0              the card-detect wakeup source of the MMC core: the boot card is
#                     non-removable, no event
#   musb-hdrc.2.auto  the musb driver arms its interrupt as a wakeup at probe, whatever the
#                     sysfs switch says; the gadget is unbound from the UDC before the freeze
#                     (step 8), and the port VBUS reaches nothing the kernel reads
