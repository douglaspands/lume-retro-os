# Suspension of the R36S (openspec device-fixes D11; read by lume-sleep, lume_core::sleep).
# mode freeze | mem. Not measured yet: the R36S J1 (task 2.3) reads /sys/power/mem_sleep and
# keeps mem only with 10 of 10 wakes by the power button. Until then, the default.
mode freeze

# Wakeup sources that must not wake the console (task 8.1): lume-sleep sets their
# power/wakeup to disabled before the suspension and back to enabled after it. Paths under
# /sys. Not measured yet (R36S J1). The power button (rk805-pwrkey) wakes through the RK817
# interrupt line, armed by `wakeup-source` on the PMIC node of the DTS (the I2C client 0-0020):
# never list the PMIC here, or nothing wakes the console.
#   rk817-charger, rk817-battery  their wakeup sources only held by change events; the plug
#                                 in/out interrupts of the charger share the PMIC line, which
#                                 the sysfs switch cannot mask (to check on the R36S J1)
nowake class/power_supply/rk817-charger
nowake class/power_supply/rk817-battery
#   rk808-rtc                     the RTC alarm: nothing in the system sets one
nowake bus/platform/devices/rk808-rtc.*
