# Power profiles of the GA36 (Allwinner A33), read by r36os-power (openspec game-governor D3;
# grammar in docs/LOGS.md, "Energia"). ROMS/system/lume/power.conf may override lines.
#
# Initial values, before the measurement (D5): boot, menu and idle have no profile, so they run
# on the kernel default (its governor, the whole clock table, every core, the GPU table).
# Only the games change:
# - game floor: no game runs below 600 MHz (EmuELEC tuning, D3 "Piso dos jogos no GA36");
# - GBA and the heavy systems start at 1008 MHz (D3 "Revisão pelo GBA").
# Clocks in kHz; 600000 and 1008000 are OPPs of the mainline sun8i-a33.dtsi (1008000 is the
# top one). Every game keeps the kernel governor.

limit game_min=600000

profile game                    # every game without a class: min = game_min
profile gba     min=1008000
profile heavy   min=1008000

class gba gba
class n64 heavy
class psp heavy
class nds heavy

battery warn=5 critical=3
