# Power profiles of the GA36 (Allwinner A33), read by r36os-power (openspec game-governor D3;
# grammar in docs/LOGS.md, "Energia"). ROMS/system/lume/power.conf may override lines.
#
# Initial values, before the measurement (D5): boot has no profile, so it runs on the kernel
# default (its governor, the whole clock table, every core, the GPU table); menu and idle only
# slow the schedutil rate limit down (below). The games:
# - game floor: no game runs below 600 MHz (EmuELEC tuning, D3 "Piso dos jogos no GA36");
# - GBA and the heavy systems start at 1008 MHz (D3 "Revisão pelo GBA").
# Clocks in kHz; 600000 and 1008000 are OPPs of the mainline sun8i-a33.dtsi (1008000 is the
# top one).
# - every game runs the bottleneck controller (controller=auto, D17): it raises only the
#   resource that limits the game (the CPU clock or the GPU floor) and lowers what is left
#   over. In gba and heavy the CPU is pinned at 1008 MHz (a range of one step), so the
#   controller only moves the GPU there.

# - menu and idle keep schedutil with a slower rate limit (P-60): the kernel default of
#   0.37 ms made the sugov:0 thread take 30% of a core in the idle launcher, because on the
#   A33 each clock change goes through the AXP regulator. Measured 2026-11-18 over 60 s:
#   50 ms 6.9%, 100 ms 4.4%, 200 ms 2.8%. The game profiles put 2 ms back for the case the
#   controller is not running (then the kernel governor drives the game).

limit game_min=600000

profile menu    governor=schedutil rate_limit_us=100000
profile idle    governor=schedutil rate_limit_us=200000
profile game    controller=auto rate_limit_us=2000   # every game without a class: min = game_min
profile gba     min=1008000 controller=auto rate_limit_us=2000
profile heavy   min=1008000 controller=auto rate_limit_us=2000

class gba gba
class n64 heavy
class psp heavy
class nds heavy

battery warn=5 critical=3
