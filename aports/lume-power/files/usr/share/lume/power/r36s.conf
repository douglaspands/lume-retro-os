# Power profiles of the R36S (RK3326), read by lume-power (openspec game-governor D3; grammar
# in docs/LOGS.md, "Energia"). ROMS/system/lume/power.conf may override lines.
#
# Kernel default in the games until the R36S measurement (P-108); no game floor.
#
# - menu and idle keep schedutil with the slower rate limit of the GA36 (game-governor D20,
#   P-60): with the kernel default the sugov:0 thread took 4.4% of a core in the idle launcher
#   (2026-11-19). The game profiles are not touched, so a game gets the kernel rate back.

battery warn=5 critical=3

profile menu    governor=schedutil rate_limit_us=100000
profile idle    governor=schedutil rate_limit_us=200000
