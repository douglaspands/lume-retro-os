# Lume Retro OS (usb-device-access D9): NetworkManager only for the Wi-Fi of a USB dongle,
# driven by the Wi-Fi menu of RetroArch (nmcli).

[main]
# RetroArch runs as "game" and there is no other user: no polkit, every request allowed
auth-polkit=false

[keyfile]
# never the USB network of the cable (usb0, 10.55.0.1, lume-usb) nor the network of the vm
unmanaged-devices=*,except:type:wifi

[connectivity]
# no "is there internet" probe to an outside server
enabled=false

[device]
# some Realtek USB drivers lose scans with a random MAC address
wifi.scan-rand-mac-address=no
