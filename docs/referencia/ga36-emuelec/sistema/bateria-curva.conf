# Curva da bateria do R36S (feature 48-bateria-percentual), lida pelo bateria-percentual.
# Um r36-bateria-curva.conf válido na raiz da p1 (R36-ROMS) a substitui sem regravar o system;
# gere um novo com tools/ajusta_curva_bateria.py a partir de outro ciclo do r36-thermal.csv.
#   r_mohm  resistência interna somada à tensão: V + r_mohm * corrente(mA) / 1000
#   filtro  suavização entre amostras de 5 s: f = f + (V compensada - f) / filtro
#   v_zero  tensão lida (mV) em ou abaixo da qual o percentual é 0
#   v_um    tensão lida (mV) em ou acima da qual o percentual é pelo menos 1
#   ponto   mV compensado,percentual; mV estritamente crescente, percentual que não diminui
# Gerada por tools/ajusta_curva_bateria.py --r-mohm 150 do ciclo completo de 26/10 (15 boots,
# 264 min, 2640 mAh integrados). Erro contra a carga integrada, dentro dessa amostra: médio
# 0.7, máximo 5.5 pontos. Reajuste com o segundo ciclo (README, feature 48).
