# Receita do snes9x2005_plus recompilado para o A33. Veja ./cores.sh --help.
# A compilação usa só o que está aqui: fonte, variáveis do make e flags.

[core]
nome = "snes9x2005_plus"
# Arquivo que o make gera e .info da base de onde saem os .info das variantes.
saida = "snes9x2005_plus_libretro.so"
info = "snes9x2005_plus_libretro.info"

[fonte]
# O mesmo fonte da base: o PKG_VERSION do EmuELEC v4.7. O "d4e2b9a" da versão
# do .so da base é o commit da árvore de build do fork, não deste repositório.
repo = "https://github.com/libretro/snes9x2005"
commit = "fd45b0e055bce6cff3acde77414558784e93e7d0"
url = "https://github.com/libretro/snes9x2005/archive/fd45b0e055bce6cff3acde77414558784e93e7d0.tar.gz"
sha256 = "a400aa12955b8aa6f877d2d0fb852d17b76121a4730858e349ed434ea56e8f05"

[make]
# O mesmo platform da base (ramo armv do Makefile). O platform=unix acrescentaria
# -fno-builtin, que a base não tem. CC, LD e GIT_VERSION vêm do cores.sh.
args = ["USE_BLARGG_APU=1", "platform=armv8-hardfloat-neon"]
# GIT_VERSION do Makefile: o libretro.c mostra "v1.36" seguido disto.
# {variante} vira o nome da variante com "-" no lugar de "_".
versao = " fd45b0e a33-{variante}"

[flags]
# Em toda chamada do compilador, depois das flags do Makefile.
comuns = [
    "-marm", "-mcpu=cortex-a7", "-mfpu=neon-vfpv4", "-mfloat-abi=hard",
    "-DNDEBUG", "-flto=auto", "-fuse-linker-plugin",
    "-ffunction-sections", "-fdata-sections",
]
# Só na ligação.
ligacao = ["-Wl,--gc-sections", "-Wl,-O1", "-s"]

[pgo]
# Onde o instrumentado grava no aparelho (p1, legível no PC) e onde o perfil
# guardado (cores/snes9x2005_plus/pgo/) é montado no container: o mesmo
# caminho nos dois, para os nomes dos .gcda baterem.
dir = "/storage/roms/pgo/snes9x2005_plus"

# Vencedora da avaliação (RESULTADOS.md), promovida a padrão do SNES com o nome
# snes9x2005_plus_a33. As outras variantes ficam fora da imagem, mas continuam
# aqui para poderem ser recompiladas.
[variantes.o2]
nome = "snes9x2005_plus_a33"
flags = ["-O2"]

[variantes.o3]
nome = "snes9x2005_plus_a33_o3"
flags = ["-O3"]

[variantes.pgo_treino]
nome = "snes9x2005_plus_a33_pgo_treino"
# Variante sem PGO cujas flags vêm antes: o o2, vencedor da rodada 2 (RESULTADOS.md).
base = "o2"
pgo = "gerar"
flags = ["-fprofile-generate={pgo_dir}", "-fprofile-update=single"]

[variantes.pgo]
nome = "snes9x2005_plus_a33_pgo"
base = "o2"
pgo = "usar"
flags = [
    "-fprofile-use={pgo_dir}", "-fprofile-partial-training",
    "-Werror=missing-profile", "-Werror=coverage-mismatch",
]

[[descartadas]]
flags = "-Ofast, -ffast-math"
motivo = "o core é quase todo inteiro, o ganho fica perto de zero e há risco no áudio"

[[descartadas]]
flags = "-mthumb"
motivo = "fica para uma variante futura"

[[descartadas]]
flags = "-funroll-loops, -falign-*"
motivo = "unroll e alinhamento manuais: o PGO cuida deles"

[[descartadas]]
flags = "-fgraphite-identity, -floop-nest-optimize, -fipa-pta"
motivo = "ganho marginal e risco de bug do compilador"

[[descartadas]]
flags = "-fno-plt"
motivo = "só afeta chamadas à libc"
